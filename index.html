<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FolioFlux — Modern Open-Source PDF Viewer &amp; Editor</title>
  <meta name="description" content="FolioFlux is a lightning-fast, privacy-first open-source PDF viewer and editor with annotations, signatures, form filling, and page management." />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="/src/styles/main.css" />
  <link rel="stylesheet" href="/src/styles/text-layer.css" />
</head>
<body data-theme="light">
  <!-- Header Toolbar Mount -->
  <div id="header-mount"></div>

  <!-- Main Application Workspace -->
  <main class="app-workspace">
    <!-- Collapsible Multi-tab Sidebar -->
    <div id="sidebar-mount"></div>

    <!-- Main Canvas View Mount -->
    <div id="canvas-mount" style="flex: 1; display: flex; position: relative; overflow: hidden;"></div>
  </main>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
